# Воркери черги задач. У Deployment НЕ задано replicas: кількістю керує kubectl scale (W = 1, 2, R = 3).
# Змінні CLAIM_MODE / RESULT_MODE / T_POLL_MS / FAIL_RATE / EXCLUSIVE_RECORD змінюють скрипти через kubectl set env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
data:
  DB_HOST: db
  DB_PORT: "5432"
  DB_USER: postgres
  DB_NAME: appointments_db
  WEB_URL: "http://web:8000"
  LEASE_SECONDS: "15"       # L за варіантом 3; heartbeat кожні L/3 = 5 с
  T_POLL_MS: "50"           # T_poll за варіантом 3
  SLICE_SIZE: "256"
  Q_LO: "0.01"
  Q_HI: "0.99"
  GRACE_SECONDS: "25"       # менше за terminationGracePeriodSeconds (30)
---
apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
  labels:
    app: worker
spec:
  clusterIP: None
  selector:
    app: worker
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 30
      # PID 1 у контейнері ігнорує SIGSTOP зсередини простору імен; зі спільним
      # простором процесів воркер отримує PID > 1 і kill -STOP працює (крок 5).
      shareProcessNamespace: true
      containers:
        - name: worker
          image: appointments-worker:lab4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9100
              name: metrics
          envFrom:
            - configMapRef:
                name: worker-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FAIL_RATE
              value: "0"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
